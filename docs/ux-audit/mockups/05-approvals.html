<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="_tokens.css"/>
<title>Shepherd — Approvals</title>
<style>
  body { padding:24px; background: rgba(19,36,28,0.45); min-height:100vh; display:grid; place-items:end center; }
  .sheet { width:min(440px,100%); background:var(--card); border-radius:20px 20px 0 0; padding:20px 20px 28px; box-shadow:0 -8px 40px rgba(0,0,0,0.2); }
  .grab { width:40px; height:4px; background:var(--line); border-radius:999px; margin:0 auto 14px; }
  .risk { background:var(--danger-bg); color:var(--danger); display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .kv { display:grid; grid-template-columns: 110px 1fr; gap:8px; margin:16px 0; font-size:14px; }
  .kv span:first-child { color:var(--muted); }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
</style></head><body>
<div class="sheet">
  <div class="grab"></div>
  <span class="risk">Needs your co-sign</span>
  <h1 style="margin-top:10px;font-size:24px">Sweep vault</h1>
  <p>Root agent wants to run a high-risk call. Review, then approve or decline.</p>
  <div class="kv">
    <span>Agent</span><span>Root agent</span>
    <span>Call</span><span class="mono">vault.sweep()</span>
    <span>Value</span><span>0 ETH</span>
    <span>Why here</span><span>Policy mode: needs co-sign</span>
  </div>
  <div class="btns">
    <button class="btn">Decline</button>
    <button class="btn primary">Approve</button>
  </div>
</div>
</body></html>
